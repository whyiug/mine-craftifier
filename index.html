<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minecraftifier</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet">
    <style>
      /* Minecraft-specific utility enhancements */
      body {
        font-family: 'VT323', monospace;
        background-color: #1a1a1a;
        background-image: 
          linear-gradient(45deg, #222 25%, transparent 25%), 
          linear-gradient(-45deg, #222 25%, transparent 25%), 
          linear-gradient(45deg, transparent 75%, #222 75%), 
          linear-gradient(-45deg, transparent 75%, #222 75%);
        background-size: 20px 20px;
        background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
      }
      .font-minecraft-title {
        font-family: 'Silkscreen', cursive;
      }
      .minecraft-border {
        box-shadow: inset 4px 4px 0px 0px #ffffff40, inset -4px -4px 0px 0px #00000040; 
      }
      .minecraft-btn:active {
        box-shadow: inset 4px 4px 0px 0px #00000040, inset -4px -4px 0px 0px #ffffff40;
        transform: translateY(2px);
      }

      /* Minecraft Slider Customization */
      input[type=range].minecraft-slider {
        -webkit-appearance: none; 
        background: transparent; 
      }
      
      input[type=range].minecraft-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 28px;
        width: 14px;
        background: #7c7c7c;
        border: 2px solid #000;
        cursor: pointer;
        margin-top: -10px; 
        box-shadow: inset 2px 2px 0px 0px #ffffff40, inset -2px -2px 0px 0px #00000040; 
      }
      
      input[type=range].minecraft-slider::-webkit-slider-runnable-track {
        width: 100%;
        height: 8px;
        cursor: pointer;
        background: #000;
        border: 0px;
      }

      input[type=range].minecraft-slider:focus {
        outline: none;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="text-gray-100 min-h-screen">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
